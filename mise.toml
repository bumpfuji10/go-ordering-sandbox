[tools]
go = "1.27.0"
node = "24.21.0"

[tasks."db:reset"]
description = "データベースを破棄して作り直す（スキーマと開発用データを流し直す）"
# 初期化の SQL はデータ領域が空のときしか実行されないため、ボリュームごと消す。
run = ["docker compose down --volumes", "docker compose up --detach --wait"]

[tasks.test]
description = "バックエンドのテストを実行する"
dir = "backend"
run = "go test ./..."
